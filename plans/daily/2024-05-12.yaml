garden:
  seasonal_reminder: |
    Mid-May in Virginia - you're past last frost. Time to:
    - Get those warm-season seedlings outside (zucchini, eggplant)
    - Plant sweet alyssum near collards for aphid control
    - Check on struggling basil - may need better drainage

  quiz_questions:
    - q: "What's the purpose of 'hardening off' seedlings?"
      a: "Gradually exposing indoor-grown plants to outdoor conditions over 7-10 days to prevent transplant shock"

    - q: "Why is sweet alyssum a good companion plant for brassicas like collards?"
      a: "It attracts beneficial insects (like hoverflies) that eat aphids, and its flowers provide habitat for predatory insects"

    - q: "What does it mean when your compost pile is 'hot'?"
      a: "Active decomposition is happening - beneficial microbes are breaking down material. Ideal temp is 130-160°F. Hot compost kills weed seeds and pathogens."

    - q: "Why are root vegetables like carrots and radishes good for breaking up clay soil?"
      a: "Their taproots physically penetrate and loosen compacted soil. When they decompose, they leave channels for water and air."

    - q: "When transplanting eggplant outdoors, what soil temperature should you wait for?"
      a: "At least 60°F, ideally 70°F+. Eggplant is a heat-lover and will stall in cold soil."

