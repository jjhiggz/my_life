[package]
name = "higgzlife-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for higgzlife personal management system"

[dependencies]
# MCP Protocol
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
higgzlife-db = { path = "../higgzlife-db" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04", "uuid1"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# UUID for activity IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Temp file for tests
[dev-dependencies]
tempfile = "3"
